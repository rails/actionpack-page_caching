name: CI

on:
  push:
    branches:
      - 'master'
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        gemfile:
          - '6-1-stable'
          - '7-0-stable'
          - '7-1-stable'
          - '7-2-stable'
          - '8-0-stable'
          - '8-1-stable'
          - 'edge'
        ruby:
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
        exclude:
          - gemfile: '6-1-stable'
            ruby: '3.1'
          - gemfile: '6-1-stable'
            ruby: '3.2'
          - gemfile: '6-1-stable'
            ruby: '3.3'
          - gemfile: '6-1-stable'
            ruby: '3.4'
          - gemfile: '7-0-stable'
            ruby: '3.3'
          - gemfile: '7-0-stable'
            ruby: '3.4'
          - gemfile: '7-1-stable'
            ruby: '3.4'
          - gemfile: '7-2-stable'
            ruby: '2.7'
          - gemfile: '7-2-stable'
            ruby: '3.0'
          - gemfile: '8-0-stable'
            ruby: '2.7'
          - gemfile: '8-0-stable'
            ruby: '3.0'
          - gemfile: '8-0-stable'
            ruby: '3.1'
          - gemfile: '8-1-stable'
            ruby: '2.7'
          - gemfile: '8-1-stable'
            ruby: '3.0'
          - gemfile: '8-1-stable'
            ruby: '3.1'
          - gemfile: 'edge'
            ruby: '2.7'
          - gemfile: 'edge'
            ruby: '3.0'
          - gemfile: 'edge'
            ruby: '3.1'
          - gemfile: 'edge'
            ruby: '3.2'
      fail-fast: false

    runs-on: ubuntu-latest
    name: ${{ matrix.ruby }} rails-${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake test

    env:
      BUNDLE_GEMFILE: gemfiles/Gemfile-${{ matrix.gemfile }}
      BUNDLE_JOBS: 4
      BUNDLE_RETRY: 3
